name: Static Analysis

# Runs the repo's static analysis (ESLint + the repo-contract rules in
# tools/eslint/repo-contract-plugin.mjs) and the test suite.
#
# WHY THIS EXISTS: `CLAUDE.md` / `AGENTS.md` → "Error observability
# (non-negotiable)" and the secret-logging rules were prose only, and prose
# does not fail a build. The three repo-contract rules encode them as errors:
#
#   repo-contract/no-silent-catch                    — no failure may be invisible
#   repo-contract/no-indistinguishable-catch-return  — no catch { return 0 }
#   repo-contract/no-sensitive-log                   — no token/chat id/user id in a log
#
# BASELINE: `eslint-suppressions.json` holds the pre-existing violations so the
# gate applies to NEW code without being permanently red. Two exit codes matter
# here, and both are actionable:
#
#   exit 1 → a NEW violation was introduced. Fix it (or add an
#            eslint-disable WITH a written reason after `--`).
#   exit 2 → a suppressed violation no longer exists, i.e. someone fixed one
#            and left a stale entry behind. Run `npm run lint:prune` and
#            commit the shrunken baseline.
#
# The baseline therefore cannot silently grow, and progress cannot be silently
# discarded. `npm run lint:debt` prints what is still owed.
#
# This workflow only reads the repo. It never deploys, never pushes, and never
# touches Netlify, Fly.io, Binance, Telegram, or any secret.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ESLint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm ci` is deliberately not used: package-lock.json is gitignored in
      # this repo (see .gitignore), so there is no lockfile to install from.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: ESLint (repo contract + hygiene)
        run: npm run lint

      - name: Remaining error-observability debt (report only, never fails)
        if: always()
        run: npm run lint:debt

      - name: Tests
        run: npm test
